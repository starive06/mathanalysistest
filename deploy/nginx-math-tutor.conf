# /etc/nginx/sites-available/math-tutor
# 使用前替换 math.example.com、证书路径和项目目录。
# 反向代理到本机 Express；不要让 3000 端口直接对公网开放。

limit_req_zone $binary_remote_addr zone=math_tutor_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name math.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name math.example.com;

    ssl_certificate     /etc/letsencrypt/live/math.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    # 教学资源上传默认上限 30 MB，留出 multipart 余量
    client_max_body_size 35m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/math-tutor.access.log;
    error_log  /var/log/nginx/math-tutor.error.log warn;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        limit_req zone=math_tutor_api burst=40 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # DeepSeek 非流式回答可能较慢
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
